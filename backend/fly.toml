app = "ai-compliance-online-api"
primary_region = "fra"  # Франкфурт

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # ВАЖНО: не даём машине засыпать при простое — иначе вебхуки ЮKassa
  # могут прийти в момент, когда бэкенд спит, и потеряться/задержаться.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"
